# Verifies every change and deploys main to GitHub Pages.
# Cost: $0 — GitHub-hosted runners are free for public repositories.
#
# Deploys from main once every check passes (CEO decision, 2026-11-04: deploys don't
# wait for the CEO). The "github-pages" environment allows only the main branch.
name: CI & Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a run on main midway: it may be deploying.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    name: Lint, typecheck, unit tests, audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Generated workforce files are in sync
        run: npm run workforce:check
      - name: No known high-severity vulnerabilities in what ships
        run: npm audit --omit=dev --audit-level=high

  # One build, with the production configuration. It is tested end to end and then deployed
  # unchanged: the site that ships is exactly the site that passed the tests.
  build-and-test:
    name: Build, end-to-end tests, secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build (production configuration; cloud settings from aicos.config.json, public values only)
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /ai-company-os
      - name: Refuse to publish anything that looks like a secret
        run: |
          if grep -rIlE "(sk-ant-[A-Za-z0-9_-]{16,}|ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|sb_secret_[A-Za-z0-9_-]{16,}|service_role|aicos_agent_[0-9a-f]{20,}|BEGIN (RSA|OPENSSH|EC) PRIVATE KEY)" out/; then
            echo "Possible secret in build output — aborting." && exit 1
          fi
      - run: npx playwright install --with-deps chromium webkit
      - name: End-to-end tests against that build (Supabase stubbed)
        run: npx playwright test
        env:
          E2E_SKIP_BUILD: "1"
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
      - if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: out

  deploy:
    name: Deploy to GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [verify, build-and-test]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
