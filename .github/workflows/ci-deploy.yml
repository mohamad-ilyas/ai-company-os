# Verifies every change and deploys main to GitHub Pages.
# Cost: $0 — GitHub-hosted runners are free for public repositories.
#
# CEO approval gate: the deploy job uses the "github-pages" environment. In
# Settings → Environments → github-pages, add yourself under "Required reviewers"
# and every production deployment will wait for your approval in GitHub.
name: CI & Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Generated workforce files are in sync
        run: npm run workforce:check

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  build:
    name: Build static site
    if: github.event_name != 'pull_request'
    needs: [verify, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - id: pages
        uses: actions/configure-pages@v6
      - name: Build
        run: npm run build
        env:
          # "/<repo>" for a project site; empty when a custom domain is configured.
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          # Cloud sync settings are read from aicos.config.json (public values only).
      - name: Refuse to publish anything that looks like a secret
        run: |
          if grep -rIlE "(sk-ant-[A-Za-z0-9_-]{16,}|ghp_[A-Za-z0-9]{20,}|sb_secret_[A-Za-z0-9_-]{16,}|service_role|BEGIN (RSA|OPENSSH) PRIVATE KEY)" out/; then
            echo "Possible secret in build output — aborting." && exit 1
          fi
      - uses: actions/upload-pages-artifact@v5
        with:
          path: out

  deploy:
    name: Deploy to GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
